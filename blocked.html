<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: rgba(0, 0, 0, 0.95);
        color: white;
        font-family: system-ui, Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        text-align: center;
      }
      .container {
        max-width: 620px;
        width: 100%;
        background: #1e1e1e;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
      }
      h1 {
        color: #ff6b6b;
        margin-bottom: 12px;
        font-size: 28px;
      }
      .break-message {
        font-size: 16px;
        color: #bbb;
        margin-bottom: 24px;
      }
      .timer {
        font-size: 56px;
        margin: 20px 0;
        letter-spacing: 4px;
        font-variant-numeric: tabular-nums;
      }
      .activities {
        background: #2a2a2a;
        border-radius: 12px;
        padding: 16px;
        margin: 20px 0;
        text-align: left;
      }
      .activities h3 {
        font-size: 14px;
        color: #4caf50;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .activities ul {
        list-style: none;
      }
      .activities li {
        padding: 6px 0;
        font-size: 15px;
        color: #ddd;
      }
      .bypass-section {
        margin-top: 28px;
        border-top: 1px solid #333;
        padding-top: 20px;
      }
      .bypass-section p {
        font-size: 13px;
        color: #999;
        margin-bottom: 10px;
      }
      .bypass-section input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #444;
        background: #2a2a2a;
        color: white;
        font-size: 13px;
      }
      .bypass-section button {
        background: #ff6b6b;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        font-size: 15px;
      }
      .bypass-section button:hover {
        background: #e55a5a;
      }
      .bypass-section button:disabled {
        background: #555;
        cursor: not-allowed;
      }
      .error {
        color: #ff6b6b;
        margin-top: 10px;
        font-size: 13px;
      }
      .strict-note {
        color: #ff9800;
        font-size: 12px;
        margin-top: 8px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>⏳ Descanso obligatorio</h1>
      <div class="break-message">
        Es momento de desconectar. Respeta tu descanso.
      </div>
      <div class="timer" id="break-timer">00:00</div>

      <div class="activities" id="activities" style="display: none">
        <h3>💡 Actividades sugeridas</h3>
        <ul id="activities-list"></ul>
      </div>

      <div class="bypass-section" id="bypass-section">
        <p>Emergencia: escribe la frase exacta para desbloquear</p>
        <input
          type="text"
          id="bypass-input"
          placeholder="Escribe la frase exacta..."
        />
        <button id="bypass-btn">Desbloquear</button>
        <div class="error" id="bypass-error"></div>
        <div class="strict-note hidden" id="strict-note">
          🔒 Modo estricto: el bypass está deshabilitado
        </div>
      </div>

      <div
        style="margin-top: 20px; border-top: 1px solid #333; padding-top: 16px"
      >
        <p style="font-size: 13px; color: #999; margin-bottom: 10px">
          ¿No quieres esperar? Puedes salir de esta página.
        </p>
        <button
          id="leave-btn"
          style="
            background: transparent;
            color: #bbb;
            border: 1px solid #555;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
          "
        >
          🚪 Salir de esta página
        </button>
      </div>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
