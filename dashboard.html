<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard - Productivity Manager</title>
    <style>
      body {
        font-family: system-ui, Arial;
        padding: 20px;
        max-width: 1100px;
        margin: auto;
        background: #f5f5f5;
      }
      h1 {
        color: #333;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
      }
      .stat {
        background: #f9f9f9;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
      }
      .stat-num {
        font-size: 36px;
        font-weight: bold;
        color: #4caf50;
      }
      .stat-lbl {
        color: #666;
        font-size: 13px;
        margin-top: 4px;
      }
      .bar-chart {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 200px;
        padding: 10px 0;
      }
      .bar {
        flex: 1;
        background: #4caf50;
        border-radius: 4px 4px 0 0;
        min-height: 4px;
        position: relative;
        transition: opacity 0.2s;
      }
      .bar:hover {
        opacity: 0.7;
      }
      .bar-label {
        position: absolute;
        bottom: -22px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: #666;
        white-space: nowrap;
      }
      .bar-value {
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: #333;
        font-weight: bold;
      }
      .rec {
        padding: 12px;
        border-radius: 8px;
        margin: 8px 0;
      }
      .rec.success {
        background: #e8f5e9;
      }
      .rec.warning {
        background: #fff3e0;
      }
      .rec.info {
        background: #e3f2fd;
      }
      .rec.productivity {
        background: #f3e5f5;
      }
      .history-item {
        padding: 8px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      .url-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>📊 Dashboard de Productividad</h1>

    <div class="card">
      <h2>Resumen</h2>
      <div class="grid" id="summary-grid"></div>
    </div>

    <div class="card">
      <h2>📈 Actividad últimos 7 días</h2>
      <div class="bar-chart" id="weekly-chart"></div>
    </div>

    <div class="card">
      <h2>🤖 Recomendaciones IA</h2>
      <div id="recs-container"></div>
    </div>

    <div class="card">
      <h2>🔗 URLs más visitadas</h2>
      <div id="urls-container"></div>
    </div>

    <div class="card">
      <h2>📜 Historial reciente</h2>
      <div id="history-container"></div>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
