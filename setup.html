<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurar Sesión</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: rgba(0, 0, 0, 0.92);
        color: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      .card {
        background: #1e1e1e;
        padding: 36px;
        border-radius: 16px;
        max-width: 460px;
        width: 90%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        border: 1px solid #2c2c2c;
      }
      h2 {
        margin-bottom: 8px;
        font-size: 24px;
        color: #ffffff;
      }
      .subtitle {
        margin-bottom: 24px;
        color: #aaaaaa;
        font-size: 15px;
      }
      .strict-badge {
        color: #ff6b6b;
        font-weight: 600;
      }
      .form-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #dddddd;
      }
      input[type="number"] {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #444444;
        background: #2a2a2a;
        color: #ffffff;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s;
      }
      input[type="number"]:focus {
        border-color: #4caf50;
      }
      .btn {
        width: 100%;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        transition:
          opacity 0.2s,
          transform 0.1s;
      }
      .btn:active {
        transform: scale(0.99);
      }
      .btn-suggest {
        margin-bottom: 12px;
        padding: 11px;
        border: 1px solid #555555;
        background: #2a2a2a;
        color: #cccccc;
        font-size: 14px;
      }
      .btn-suggest:hover {
        background: #333333;
        color: #ffffff;
      }
      .btn-start {
        padding: 14px;
        border: none;
        background: #4caf50;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
      }
      .btn-start:hover {
        background: #45a049;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 id="title">⏱️ Configura tu sesión</h2>
      <p class="subtitle" id="subtitle">Modo: <strong>Estándar</strong></p>

      <div class="form-group">
        <label for="session-duration">Sesión (min)</label>
        <input
          type="number"
          id="session-duration"
          value="25"
          min="1"
          max="240"
        />
      </div>

      <div class="form-group">
        <label for="break-duration">Descanso (min)</label>
        <input type="number" id="break-duration" value="5" min="1" max="120" />
      </div>

      <button id="suggest-btn" class="btn btn-suggest">
        🤖 Sugerir duración con IA
      </button>
      <button id="start-session-btn" class="btn btn-start">
        ▶ Iniciar sesión
      </button>
    </div>

    <script src="setup.js"></script>
  </body>
</html>
