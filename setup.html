<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurar Sesión - TimeWarden</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        color: #f8fafc;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .card {
        background: rgba(30, 41, 59, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 36px;
        border-radius: 20px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      h2 {
        margin-bottom: 6px;
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
      }
      .subtitle {
        margin-bottom: 24px;
        color: #94a3b8;
        font-size: 14px;
      }
      .strict-badge {
        color: #f87171;
        font-weight: 600;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 500;
        color: #cbd5e1;
      }
      input[type="number"] {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(15, 23, 42, 0.8);
        color: #ffffff;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
        outline: none;
        transition: border-color 0.2s;
      }
      input[type="number"]:focus {
        border-color: #10b981;
      }
      .btn {
        width: 100%;
        border-radius: 10px;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.15s;
      }
      .btn:active {
        transform: scale(0.99);
      }
      .btn-suggest {
        margin-bottom: 10px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.05);
        color: #e2e8f0;
        font-size: 13px;
        font-weight: 600;
      }
      .btn-suggest:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
      }
      .btn-start {
        padding: 14px;
        border: none;
        background: #10b981;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      }
      .btn-start:hover {
        background: #059669;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 id="title">⏱️ Configura tu sesión</h2>
      <p class="subtitle" id="subtitle">Modo: <strong>Estándar</strong></p>

      <div class="form-row">
        <div class="form-group">
          <label for="session-duration">Sesión (min)</label>
          <input
            type="number"
            id="session-duration"
            value="25"
            min="1"
            max="240"
          />
        </div>

        <div class="form-group">
          <label for="break-duration">Descanso (min)</label>
          <input
            type="number"
            id="break-duration"
            value="5"
            min="1"
            max="120"
          />
        </div>
      </div>

      <button id="suggest-btn" class="btn btn-suggest">
        🤖 Sugerir duración con IA
      </button>
      <button id="start-session-btn" class="btn btn-start">
        ▶ Iniciar sesión
      </button>
    </div>

    <script src="setup.js"></script>
  </body>
</html>
